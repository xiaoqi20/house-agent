# 一期默认用 SQLite（零依赖）。需要 Postgres（选型文档生产口径）时：
#   docker compose up -d db && export DATABASE_URL=postgresql+asyncpg://rentgraph:rentgraph@localhost:5433/rentgraph
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rentgraph
      POSTGRES_PASSWORD: rentgraph
      POSTGRES_DB: rentgraph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
