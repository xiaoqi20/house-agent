services:
  db:
    image: postgres:16-alpine
    container_name: rentgraph-pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: rentgraph
      POSTGRES_PASSWORD: rentgraph
      POSTGRES_DB: rentgraph
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
